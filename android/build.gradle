// Versions are pinned. The Android Gradle plugin's version decides which
// Gradle it needs, which decides which JDK: 8.7.3 wants Gradle 8.9 or newer
// and JDK 17 or newer (21 works).
buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

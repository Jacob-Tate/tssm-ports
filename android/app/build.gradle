plugins {
    id 'com.android.application'
}

// The co-op app: SDL's Java half, four small activities of our own
// (LauncherActivity, CoopNoticeActivity, ImportActivity, GameActivity), and
// the game itself with co-op as libmain.so, built by the repository's
// CMakeLists.txt. It installs beside the normal app (its own application ID,
// the same signing key) and plays on that app's saves and game files.
// docs/ANDROID.md, "The co-op app".
//
// Properties (gradle -P<name>=<value>):
//
//   tssm.abis      ABIs to build, comma-separated. Each gets its own APK
//                  (app-<abi>-debug.apk). Default armeabi-v7a,arm64-v8a.
//   tssm.backends  TSSM_RENDER_BACKENDS: GL3 (default), VULKAN, or GL3;VULKAN.
//   tssm.ffmpeg    A folder of FFmpeg builds, one per ABI (<folder>/<abi>/
//                  include and lib), from tools/android/build_ffmpeg.sh. The
//                  movies play with it; without it they are skipped. The
//                  environment variable TSSM_FFMPEG_ANDROID works too.
//   tssm.icon      A folder made by tools/make_icons.ps1 from a picture,
//                  outside the repository (docs/ICON.md). Its android/res
//                  overrides the launcher icon; without it the APK keeps the
//                  default one in src/main/res.

// third_party/SDL's own Java half, compiled straight out of the submodule so
// the two halves of SDL cannot drift apart.
def sdlJava = file('../../third_party/SDL/android-project/app/src/main/java')

def tssmAbis = (project.findProperty('tssm.abis') ?: 'armeabi-v7a,arm64-v8a')
        .split(',').collect { it.trim() }.findAll { !it.isEmpty() }
def tssmBackends = project.findProperty('tssm.backends') ?: 'GL3'
def tssmFfmpeg = project.findProperty('tssm.ffmpeg') ?: System.getenv('TSSM_FFMPEG_ANDROID') ?: ''

// The launcher icon from a local picture: <tssm.icon>/android/res, added to
// the debug and release resources, which take precedence over main's. It has
// mipmap-*dpi/ic_launcher.png (legacy launchers), mipmap-anydpi-v26/
// ic_launcher.xml with its foreground and background layers, and nothing
// else, so only @mipmap/ic_launcher changes (the manifest and the long-press
// shortcut use it).
def tssmIcon = project.findProperty('tssm.icon') ?: ''
def tssmIconRes = null
if (!tssmIcon.isEmpty()) {
    tssmIconRes = new File(file(tssmIcon), 'android/res')
    if (!new File(tssmIconRes, 'mipmap-anydpi-v26/ic_launcher.xml').isFile()) {
        throw new GradleException("tssm.icon: ${tssmIconRes} has no mipmap-anydpi-v26/ic_launcher.xml. " +
                'Make the folder with tools/make_icons.ps1 (docs/ICON.md).')
    }
    logger.lifecycle("tssm: launcher icon from ${tssmIconRes}")
}

// The co-op badge over whichever icon that is (res/drawable/coop_badge.xml,
// res/mipmap*/ic_launcher_coop.xml): the two layers named here, since the
// default icon and tssm.icon's name their foreground differently.
def coopIconRes = new File(layout.buildDirectory.get().asFile, 'generated/tssm-coop-icon/res')
def coopForeground = tssmIconRes != null ? '@mipmap/ic_launcher_foreground' : '@drawable/ic_launcher_foreground'
def coopBackground = tssmIconRes != null ? '@color/tssm_icon_background' : '@color/ic_launcher_background'
new File(coopIconRes, 'drawable').mkdirs()
new File(coopIconRes, 'values').mkdirs()
new File(coopIconRes, 'drawable/coop_icon_foreground.xml').text = """<?xml version="1.0" encoding="utf-8"?>
<!-- Made by app/build.gradle. -->
<layer-list xmlns:android="http://schemas.android.com/apk/res/android">
    <item android:drawable="${coopForeground}" />
    <item android:drawable="@drawable/coop_badge" />
</layer-list>
"""
new File(coopIconRes, 'values/coop_icon.xml').text = """<?xml version="1.0" encoding="utf-8"?>
<!-- Made by app/build.gradle. -->
<resources>
    <color name="coop_icon_background">${coopBackground}</color>
</resources>
"""

def cmakeArgs = [
    // The game is C++ and librw is C++; the shared runtime would be a second
    // .so in the APK for nothing.
    '-DANDROID_STL=c++_static',
    '-DANDROID_PLATFORM=android-24',
    '-DTSSM_RENDER_BACKENDS=' + tssmBackends,
]
if (!tssmFfmpeg.isEmpty()) {
    cmakeArgs += '-DTSSM_FFMPEG_ROOT=' + file(tssmFfmpeg).absolutePath.replace('\\', '/')
}

// The co-op version code tools/coop_id.cmake gives the native build, for the
// version name, as the Switch's .nro carries it. The SDK's CMake runs it.
def coopCode = 'unknown'
try {
    def sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    def localProps = rootProject.file('local.properties')
    if (sdkDir == null && localProps.isFile()) {
        def props = new Properties()
        localProps.withInputStream { props.load(it) }
        sdkDir = props.getProperty('sdk.dir')
    }
    def windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
    def cmakeExe = new File(sdkDir, 'cmake/3.22.1/bin/cmake' + (windows ? '.exe' : ''))
    def repo = file('../..').absolutePath.replace('\\', '/')
    def text = providers.exec {
        commandLine cmakeExe.absolutePath, "-DSRC=${repo}", '-P', "${repo}/tools/coop_id.cmake"
        ignoreExitValue = true
    }.standardOutput.asText.get()
    def m = text =~ /co-op version ([0-9a-z]+)/
    if (m.find()) {
        coopCode = m.group(1)
    }
} catch (Exception e) {
    logger.warn("tssm: the co-op version code could not be worked out: ${e}")
}
logger.lifecycle("tssm: co-op version ${coopCode}")

android {
    namespace = 'io.github.tssmport.game'
    compileSdk = 35

    // The NDK the SDL submodule's own template pins (r28c).
    ndkVersion = '28.2.13676358'

    defaultConfig {
        // Not the normal app's io.github.tssmport.game: installed beside it.
        // The Java classes keep that package (namespace above).
        applicationId = 'io.github.tssmport.game.coop'

        // 24: GLES 3 where the device has it, and the storage behaviour the
        // import screen is written against.
        minSdk = 24
        targetSdk = 35

        versionCode = 16
        versionName = '0.9-' + coopCode

        externalNativeBuild {
            cmake {
                arguments(*cmakeArgs)

                // Just the game. Without this, AGP builds every target the
                // CMake project defines.
                targets 'main'
            }
        }
    }

    // One APK per ABI: arm64-v8a, the 64-bit build, for phones that run only
    // 64-bit apps (it widens the assets' 4-byte pointer slots as they load,
    // as the Windows x64 build does), and armeabi-v7a, the 32-bit build, for
    // older phones. docs/ANDROID.md.
    splits {
        abi {
            enable true
            reset()
            include(*tssmAbis)
            universalApk false
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable = true

            // Optimised, with symbols (stripped in the APK). AGP builds a
            // debug variant's native code as CMake Debug, which is -O0.
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += sdlJava
            res.srcDirs += coopIconRes
        }
        if (tssmIconRes != null) {
            debug {
                res.srcDirs += tssmIconRes
            }
            release {
                res.srcDirs += tssmIconRes
            }
        }
    }

    // libmain.so compressed in the APK and extracted at install: a smaller
    // file to copy to the phone.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    externalNativeBuild {
        cmake {
            // The port's one build file, three directories up.
            path = file('../../CMakeLists.txt')
            version = '3.22.1'
        }
    }

    lint {
        abortOnError = false
    }
}
